name: Release

# Push a version tag (git tag -s v0.1.0 && git push origin v0.1.0) to publish
# a GitHub release of that commit: source archives plus SHA-256 checksums.
# Nothing is published unless the tests and supply-chain checks pass, the
# tag matches pyproject.toml, and the tagged commit is on main.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  release:
    needs: [quality, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          fetch-depth: 0

      - name: Check tag, version and branch
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          # 0.x versions and pre-release suffixes (a/b/rc) are prereleases.
          PRERELEASE=false
          case "$VERSION" in 0.*|*a[0-9]*|*b[0-9]*|*rc[0-9]*) PRERELEASE=true ;; esac
          {
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # Gate 0 of docs/public-release-strategy.md: nothing internal may ship.
      # The banned list is a secret (one regex per line) because the list
      # itself names what must not appear. Without it, nothing is released.
      - name: Scan the release tree for internal identifiers
        env:
          RELEASE_SCAN_PATTERNS: ${{ secrets.RELEASE_SCAN_PATTERNS }}
        run: |
          if [ -z "$RELEASE_SCAN_PATTERNS" ]; then
            echo "::error::secret RELEASE_SCAN_PATTERNS is not set; refusing to release"
            exit 1
          fi
          BANNED=$(mktemp)
          printf '%s\n' "$RELEASE_SCAN_PATTERNS" > "$BANNED"
          git ls-files -z | xargs -0 python3 tools/release_scan.py --banned "$BANNED"

      - name: Build source archives and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME="abapgit-transport-generator-$VERSION"
          mkdir dist
          git archive --format=tar.gz --prefix="$NAME/" -o "dist/$NAME.tar.gz" "$TAG"
          git archive --format=zip --prefix="$NAME/" -o "dist/$NAME.zip" "$TAG"
          (cd dist && sha256sum ./* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FLAGS=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" dist/* "${FLAGS[@]}"
