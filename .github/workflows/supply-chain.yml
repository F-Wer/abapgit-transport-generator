name: Supply chain

# Vulnerability and license checks of the runtime dependencies. Also called
# by the release workflow, so a release cannot skip them.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'   # weekly: new advisories appear without code changes
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PIP_AUDIT_VERSION: '2.7.3'
  PIP_LICENSES_VERSION: '5.5.5'
  # Licenses allowed in the runtime dependency tree (substring match): the
  # project is GPL-2.0-only, so GPL-2.0 (only or or-later) and permissive
  # licenses. GPL-3.0-only and other GPL-2.0-incompatible licenses fail.
  ALLOWED_LICENSES: 'MIT;BSD;Apache;PSF;Python Software Foundation;ISC;GPL-2.0;GPLv2'
  # Known advisories in cryptography 48.x, an unused dependency that pysap
  # pins below 49. Remove together with pysap (issue #80).
  IGNORED_VULNS: 'PYSEC-2026-3552 PYSEC-2026-3553 PYSEC-2026-3554'

jobs:
  vulnerabilities:
    name: Known vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Audit runtime requirements
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          IGNORES=()
          for id in $IGNORED_VULNS; do IGNORES+=(--ignore-vuln "$id"); done
          pip-audit --requirement requirements.txt --strict "${IGNORES[@]}"

  licenses:
    name: Dependency licenses (pip-licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check runtime dependency licenses
        run: |
          # Inspect a clean runtime-only environment, so the checker's own
          # dependencies are not counted.
          python -m venv runtime
          runtime/bin/python -m pip install --requirement requirements.txt
          python -m pip install "pip-licenses==${PIP_LICENSES_VERSION}"
          pip-licenses --python runtime/bin/python --from=mixed --format=markdown \
            | tee licenses.md
          pip-licenses --python runtime/bin/python --from=mixed --partial-match \
            --allow-only="$ALLOWED_LICENSES"
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-licenses
          path: licenses.md
          if-no-files-found: ignore
