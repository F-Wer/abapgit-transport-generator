[project]
name = "abapgit-to-transport"
version = "0.1.0"
description = "Generate SAP transport files from abapGit repositories"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
dependencies = ["pysap==0.2.1", "defusedxml==0.7.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "templates: needs a template directory (ABAPGIT_TRANSPORT_TEMPLATES or the bundled default)",
]

[tool.coverage.run]
branch = true
source = [
  "transport_object_scanner",
  "transport_object_registry",
  "devc_helpers",
  "object_handlers",
  "sap_transport_records",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
precision = 1
