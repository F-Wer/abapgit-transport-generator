name: 'abapGit → SAP Transport'
description: 'Generate SAP transport files (cofile + data) from an abapGit repository'
author: 'SAP Transport Tooling'

inputs:
  request:
    description: 'Transport request number (e.g. DEVK900001)'
    required: true
  object:
    description: 'Object to transport (leave empty for ALL detected objects)'
    required: false
    default: ''
  package:
    description: 'ABAP package (DEVCLASS) the objects belong to, e.g. /NAMESPACE/PACKAGE or ZPACKAGE. Without it the import MOVES the objects into the template package.'
    required: false
    default: ''
  author:
    description: 'SAP user for generated object metadata (optional; defaults to the template author)'
    required: false
    default: ''
  sid:
    description: "SAP system ID (default: the request's first three characters)"
    required: false
    default: ''
  templates:
    description: 'Template directory containing templates.json (e.g. checked out from a private repository). Empty: ABAPGIT_TRANSPORT_TEMPLATES, else the bundled default.'
    required: false
    default: ''
  output-dir:
    description: 'Directory for generated transport files'
    required: false
    default: './transport-output'

outputs:
  cofile:
    description: 'Path to the generated cofile'
    value: ${{ steps.generate.outputs.cofile }}
  datafile:
    description: 'Path to the generated data file'
    value: ${{ steps.generate.outputs.datafile }}
  zip:
    description: 'Path to the zip bundling the cofile and the data file'
    value: ${{ steps.generate.outputs.zip }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Install pinned runtime dependency
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --requirement "$ACTION_PATH/requirements.txt"

    # Inputs reach the scripts only through environment variables. Writing
    # ${{ inputs.* }} into a run block pastes the value into the script
    # source, so a quote or $(...) in an input would run as shell code, and
    # SAP's literal $TMP package would be expanded by Bash.
    - name: Generate transport
      id: generate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_REQUEST: ${{ inputs.request }}
        INPUT_OBJECT: ${{ inputs.object }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_AUTHOR: ${{ inputs.author }}
        INPUT_SID: ${{ inputs.sid }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_TEMPLATES: ${{ inputs.templates }}
      run: |
        # A request is <3-char SID><type letter><6 digits>, e.g. DEVK900001.
        # Validate the values that become file names before using them.
        # The SID defaults to the request's own system.
        INPUT_SID="${INPUT_SID:-${INPUT_REQUEST:0:3}}"
        if ! [[ "$INPUT_SID" =~ ^[A-Z][A-Z0-9]{2}$ ]]; then
          echo "::error::sid must be a 3-character SAP system ID: $INPUT_SID"
          exit 1
        fi
        if ! [[ "$INPUT_REQUEST" =~ ^${INPUT_SID}[A-Z][0-9]{6}$ ]]; then
          echo "::error::request must be ${INPUT_SID}<letter><6 digits>: $INPUT_REQUEST"
          exit 1
        fi

        # No --object: ALL detected objects go into one transport.
        ARGS=()
        if [ -n "$INPUT_OBJECT" ]; then ARGS+=(--object "$INPUT_OBJECT"); fi
        if [ -n "$INPUT_PACKAGE" ]; then ARGS+=(--package "$INPUT_PACKAGE"); fi
        if [ -n "$INPUT_AUTHOR" ]; then ARGS+=(--author "$INPUT_AUTHOR"); fi
        if [ -n "$INPUT_TEMPLATES" ]; then ARGS+=(--templates "$INPUT_TEMPLATES"); fi

        echo "Generating transport → $INPUT_REQUEST"
        python "$ACTION_PATH/abapgit_to_transport.py" . \
          --request "$INPUT_REQUEST" \
          --sid "$INPUT_SID" \
          "${ARGS[@]}" \
          --output "$INPUT_OUTPUT_DIR"

        DIGITS="${INPUT_REQUEST:4}"
        COFILE="$INPUT_OUTPUT_DIR/K${DIGITS}.$INPUT_SID"
        DATAFILE="$INPUT_OUTPUT_DIR/R${DIGITS}.$INPUT_SID"
        ZIP="$INPUT_OUTPUT_DIR/${INPUT_REQUEST}.zip"

        # Bundle both files. Done in python because `zip` is not guaranteed
        # to exist (it is absent from Git Bash), and python is already here.
        python - "$ZIP" "$COFILE" "$DATAFILE" <<'PY'
        import pathlib, sys, zipfile
        zip_path, *files = sys.argv[1:]
        with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as bundle:
            for name in files:
                bundle.write(name, pathlib.Path(name).name)
        size = pathlib.Path(zip_path).stat().st_size
        print(f"Bundled {len(files)} files into {zip_path} ({size:,} bytes)")
        PY

        {
          echo "cofile=${COFILE}"
          echo "datafile=${DATAFILE}"
          echo "zip=${ZIP}"
        } >> "$GITHUB_OUTPUT"

    - name: Verify transport
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DATAFILE: ${{ steps.generate.outputs.datafile }}
        INPUT_REQUEST: ${{ inputs.request }}
        INPUT_PACKAGE: ${{ inputs.package }}
        # The verifier checks that no template identity survives, so it
        # must read the same template directory as the generate step.
        ABAPGIT_TRANSPORT_TEMPLATES: ${{ inputs.templates }}
      run: |
        # Structural self-check of the generated data file before this
        # action's outputs are used by anything downstream (release
        # publishing, artifact upload, etc). Exit code 1 fails this step,
        # which fails the composite action — a structurally broken
        # transport can never be shipped.
        python "$ACTION_PATH/test_transport.py" \
          "$DATAFILE" "$INPUT_REQUEST" "$INPUT_PACKAGE"
